# Render Blueprint: New → Blueprint → select this repo → enter GROQ_API_KEY when prompted → Apply.
services:
  - type: web
    name: sql-query-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.seed
    # Single worker on purpose: conversation memory is in-process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false          # secret: entered in the Render dashboard, never committed
      - key: LLM_MODEL
        value: groq:openai/gpt-oss-120b
      - key: LLM_EFFORT
        value: low
      - key: RATE_LIMIT_PER_MIN
        value: "10"          # protects the Groq free-tier quota (shared per organization)
